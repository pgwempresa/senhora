<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendário 2027 de Nossa Senhora</title>
<meta name="description" content="Monte o seu Calendário 2027 de Nossa Senhora com a foto da sua família.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cor:#1F3B73;        /* cor principal */
  --cor-clara:#EEF2FA;
  --verde:#16A34A;      /* botão de contribuir */
  --verde-esc:#12813B;
  --texto:#1A1A1A;
  --cinza:#5F5F5F;
  --borda:#E4E4E4;
  --fundo:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:400 18px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
[hidden]{display:none!important}

.wrap{max-width:460px;margin:0 auto;padding:0 18px 40px}

/* topo */
.top{position:sticky;top:0;z-index:10;background:#fff;padding:12px 18px 10px;max-width:460px;margin:0 auto}
.top-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:40px}
.voltar{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--texto)}
.voltar svg{width:24px;height:24px}
.marca{font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--cor);text-align:center}
.marca img{max-height:38px;margin:0 auto}
.barra{height:6px;background:#EDEDED;border-radius:99px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;width:0;background:var(--cor);border-radius:99px;transition:width .5s ease}

/* tela */
.tela{padding-top:14px;animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(12px)}}
.titulo{margin:6px 0 0;font-size:25px;line-height:1.22;font-weight:800;text-align:center;letter-spacing:-.01em}
.texto{margin:10px 0 0;color:var(--cinza);text-align:center;font-size:17.5px}
.pergunta{margin:22px 0 0;font-size:21px;font-weight:700;text-align:center;line-height:1.25}
.foto{margin:16px 0 0;border-radius:14px;overflow:hidden;position:relative;background:#F2F2F2}
.foto img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.foto .ph-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#9A9A9A;font-size:13px;font-weight:600;text-align:center;padding:10px}
.foto .ph-lbl b{font-size:26px}

/* opções */
.opcoes{display:grid;gap:12px;margin-top:20px}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 16px;background:#fff;border:2px solid var(--borda);border-radius:12px;text-align:left;font-weight:600;font-size:18px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:border-color .15s,background .15s,transform .1s}
.op:active{transform:scale(.98)}
.op:hover{border-color:#C9C9C9}
.op.sel{border-color:var(--cor);background:var(--cor-clara)}
.op .emo{font-size:24px;line-height:1;flex:none;width:30px;text-align:center}
.op .ck{margin-left:auto;flex:none;width:24px;height:24px;border-radius:6px;border:2px solid #CFCFCF;display:grid;place-items:center}
.op.sel .ck{background:var(--cor);border-color:var(--cor)}
.op.sel .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.op-img{display:flex;flex-direction:column;padding:0;overflow:hidden;background:#fff;border:2px solid var(--borda);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.04);text-align:center;transition:border-color .15s,transform .1s}
.op-img:active{transform:scale(.97)}
.op-img.sel{border-color:var(--cor)}
.op-img .foto{margin:0;border-radius:0;aspect-ratio:1/1}
.op-img span.nm{display:block;padding:10px 8px 12px;font-weight:700;font-size:15.5px;line-height:1.25}
.op-img.sel span.nm{background:var(--cor);color:#fff}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;margin-top:22px;padding:14px 20px;border:0;border-radius:12px;background:var(--cor);color:#fff;font-weight:700;font-size:19px;box-shadow:0 6px 16px -6px rgba(31,59,115,.55);transition:opacity .15s,transform .1s;text-decoration:none;text-align:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.verde{background:var(--verde);box-shadow:0 8px 18px -6px rgba(22,163,74,.6)}
.btn.verde:hover{background:var(--verde-esc)}
.btn.contorno{background:#fff;color:#128C4A;border:2px solid #25A35A;box-shadow:none}
.pulsa{animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

/* campos */
.campo{display:block;width:100%;margin-top:22px;min-height:62px;padding:14px 18px;border:2px solid var(--borda);border-radius:12px;font-size:19px;background:#fff;outline:none;transition:border-color .15s}
.campo:focus{border-color:var(--cor)}
.campo::placeholder{color:#A8A8A8}

/* destaque / acolhimento */
.destaque{margin:20px 0 0;padding:18px;border-radius:12px;background:#FBF6E9;border-left:4px solid #C99A3B;font-size:18px;font-weight:600;line-height:1.4}
.destaque small{display:block;margin-top:8px;font-weight:500;color:#8A6D2E;font-size:14.5px}

/* lista */
.lista{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.lista li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:#F7F7F7;font-weight:600;font-size:17px;line-height:1.35}
.lista li .emo{font-size:22px;line-height:1.1}

/* carrossel */
.carrossel{margin-top:18px}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:14px}
.trilho::-webkit-scrollbar{display:none}
.trilho .foto{flex:none;width:100%;min-width:100%;margin:0;scroll-snap-align:center;aspect-ratio:4/5}
.pontos{display:flex;justify-content:center;gap:7px;margin-top:10px}
.pontos i{width:8px;height:8px;border-radius:50%;background:#D5D5D5;transition:all .2s}
.pontos i.on{background:var(--cor);width:22px;border-radius:99px}

/* carregando */
.carregando{text-align:center;padding-top:30px}
.pct{font-size:56px;font-weight:800;color:var(--cor);letter-spacing:-.02em;margin-top:18px}
.barra-g{height:14px;background:#EDEDED;border-radius:99px;overflow:hidden;margin:14px 0 0}
.barra-g i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cor),#3D63B0);border-radius:99px}
.perg-carrega{margin-top:22px}
.perg-carrega .titulo{margin-bottom:14px}
.perg-carrega .op{margin-bottom:10px}
.etapas{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:12px;text-align:left}
.etapas li{display:flex;gap:12px;align-items:center;font-size:17px;color:#B0B0B0;transition:color .3s}
.etapas li.on{color:var(--texto);font-weight:600}
.etapas li .bol{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #D5D5D5;display:grid;place-items:center}
.etapas li.on .bol{background:var(--verde);border-color:var(--verde)}
.etapas li.on .bol::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}


/* pix */
.pixfundo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.pixbox{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:22px 18px 26px}
.pixbox h2{margin:0 0 6px;font-size:23px;font-weight:800;line-height:1.25}
.pixbox p{margin:0 0 6px;color:#444;font-size:17px}
.pixbox .campo{margin-top:12px}
.pixbox .fechar{float:right;border:0;background:none;font-size:30px;line-height:1;color:#777;padding:0 4px}
.pixqr{display:block;margin:14px auto 0;width:210px;height:210px;border:1px solid var(--borda);border-radius:12px;padding:8px;background:#fff}
.pixcod{margin-top:12px;padding:12px;background:#F4F4F4;border-radius:10px;font-size:13px;word-break:break-all;color:#333;max-height:84px;overflow:auto}

/* final */
.selo{display:inline-block;margin:0 auto;padding:6px 14px;border-radius:99px;background:#E8F6EE;color:#12813B;font-weight:700;font-size:14px}
.centro{text-align:center}
.resumo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.resumo span{padding:7px 12px;border-radius:99px;background:var(--cor-clara);color:var(--cor);font-weight:600;font-size:14.5px}
.caixa{margin-top:26px;padding:20px 18px;border-radius:14px;border:1px solid var(--borda);background:#fff}
.caixa h3{margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.25}
.caixa p{margin:0;color:#444;font-size:17px}
.passos{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:14px}
.passos li{display:flex;gap:14px;align-items:flex-start;font-size:17px;font-weight:500}
.passos b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cor);color:#fff;display:grid;place-items:center;font-size:16px}
.h2{margin:34px 0 0;font-size:23px;font-weight:800;text-align:center;line-height:1.25}
.valores{display:grid;gap:12px;margin-top:18px}
.valor{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:2px solid var(--borda);border-radius:14px;background:#fff;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:border-color .15s,background .15s}
.valor.sel{border-color:var(--verde);background:#F1FAF4}
.valor .rd{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #C9C9C9;display:grid;place-items:center}
.valor.sel .rd{border-color:var(--verde)}
.valor.sel .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde)}
.valor .vl{font-size:26px;font-weight:800;white-space:nowrap}
.valor .ds{font-size:15.5px;color:#555;font-weight:500;line-height:1.3}
.valor .tag{position:absolute;top:-11px;right:14px;padding:3px 10px;border-radius:99px;background:var(--verde);color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.seguro{margin:12px 0 0;text-align:center;color:#6B6B6B;font-size:15px}
.faq{margin-top:12px}
.faq details{border-bottom:1px solid var(--borda)}
.faq summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:16px 0;font-weight:700;font-size:17px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;color:var(--cor);font-weight:600}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0 0 16px;color:#444;font-size:16.5px}
.rodape{margin-top:36px;text-align:center;color:#9A9A9A;font-size:13px}
.upload{display:block;width:100%;max-width:320px;margin:20px auto 0;aspect-ratio:1/1;border:2px dashed #C4C4C4;border-radius:16px;overflow:hidden;cursor:pointer;background:#FAFAFA}
.upload img{width:100%;height:100%;object-fit:cover}
.up-in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--cor);font-weight:700;font-size:17px;text-align:center;padding:16px}
.up-in b{font-size:46px;line-height:1}
.btn.contorno2{background:#fff;color:var(--cor);border:2px solid var(--cor);box-shadow:none;margin-top:12px}
.link{display:block;margin:14px auto 0;padding:12px;border:0;background:none;color:var(--cor);font-weight:700;font-size:17px;text-decoration:underline;text-underline-offset:4px}
.sua-foto{display:flex;align-items:center;gap:14px;margin-top:18px;padding:12px;border-radius:14px;background:#F1FAF4;border:1px solid #CDEBD8;font-weight:600;font-size:16px}
.sua-foto img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.aviso{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);opacity:0;max-width:calc(100% - 32px);padding:13px 18px;border-radius:10px;background:#1A1A1A;color:#fff;font-weight:600;font-size:15px;transition:all .3s;z-index:50;text-align:center}
.aviso.on{transform:translate(-50%,0);opacity:1}
</style>

<header class="top">
  <div class="top-row">
    <button class="voltar" id="voltar" type="button" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="marca" id="marca"></div>
  </div>
  <div class="barra"><i id="barra"></i></div>
</header>

<main class="wrap" id="app"></main>
<div class="aviso" id="aviso" role="status"></div>

   CONFIGURAÇÃO: preencha aqui

/* =====================================================
   TELAS DO QUIZ
   ===================================================== */

      ["filhos", "Pelos meus filhos", "👨‍👩‍👧"], ["netos", "Pelos meus netos", "👶"], ["conjuge", "Pelo meu marido ou minha esposa", "💑"],

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tx = s => esc(s).replace(/\{nome\}/g, esc(R.nome || ""));
const foto = (src, ratio, nome) => `<div class="foto" style="aspect-ratio:${ratio || "1/1"}"><div class="ph-lbl"><b>🖼️</b>${esc(nome || src)}</div><img src="${src}" alt="" onerror="this.remove()"></div>`;
const brl = v => "R$ " + Number(v).toLocaleString("pt-BR");

function limparTimers() { timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; }
function aviso(m) { const a = document.getElementById("aviso"); a.textContent = m; a.classList.add("on"); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove("on"), 2500); }
function track(ev, data, custom) { try { window.fbq && fbq(custom ? "trackCustom" : "track", ev, data || {}); } catch (e) {} }
function enviar(etapa) {
  if (!CONFIG.webhook) return;
  try { fetch(CONFIG.webhook, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ etapa, ...R, utm: Object.fromEntries(params) }) }); } catch (e) {}
}

function ir(id, voltando) {
  limparTimers();
  const t = TELAS[id];
  if (!voltando && historico[historico.length - 1] !== id) historico.push(id);
  document.getElementById("barra").style.width = Math.round((t.passo / TOTAL) * 100) + "%";
  document.getElementById("voltar").hidden = historico.length < 2 || t.tipo === "carregando" || t.tipo === "final";
  app.innerHTML = `<section class="tela">${render[t.tipo](t, id)}</section>`;
  window.scrollTo(0, 0);
  montar[t.tipo] && montar[t.tipo](t, id);
  track("QuizEtapa", { etapa: t.passo, tela: id }, true);
}
function voltar() { if (historico.length < 2) return; historico.pop(); ir(historico[historico.length - 1], true); }
document.getElementById("voltar").addEventListener("click", voltar);

    <input type="file" id="arq" accept="image/*" hidden>

      ? `<button class="btn" type="button" data-ok>Usar essa foto</button><label class="btn contorno2" for="arq">Trocar a foto</label>`

        <li><span class="bol"></span>Reservando o lugar da sua foto na capa</li>

        <li><span class="bol"></span>Colocando a ${esc(ORACOES[R.oracao] || "sua oração")} em todos os meses</li>
      </ul></div>`;

  final: () => {

    if (R.valor == null) R.valor = (R.praquem === "dois" && v.find(x => x.valor === 100)) ? 100 : (v.find(x => x.tag) || v[0]).valor;
    const resumo = [DEVOCOES[R.devocao], ORACOES[R.oracao] ? "Oração: " + ORACOES[R.oracao] : "", (R.datas || []).filter(d => d !== "nenhuma").length ? "Datas da família marcadas" : "", R.fotoArquivo ? "Foto escolhida ✓" : "Foto na capa"].filter(Boolean);
    return `<div class="centro"><span class="selo">✓ Calendário reservado</span></div>
      <h1 class="titulo" style="margin-top:12px">Pronto, ${esc(R.nome || "")}! O seu Calendário 2027 tá reservado 🙏</h1>

      <div class="caixa">

        ${CONFIG.outroValor ? `<button type="button" class="valor${R.valor === "outro" ? " sel" : ""}" data-val="outro"><span class="rd"></span><span class="ds"><b style="font-size:18px;color:#1A1A1A">Outro valor</b><br>de ${brl(CONFIG.valorMin)} a ${brl(CONFIG.valorMax)}</span></button>` : ""}</div>
      <input class="campo" id="outro" type="text" inputmode="numeric" placeholder="Digite o valor (R$ ${CONFIG.valorMin} a R$ ${CONFIG.valorMax})" ${R.valor === "outro" ? "" : "hidden"}>

const montar = {
  grade(t) { app.querySelectorAll(".op-img").forEach(b => b.onclick = () => escolher(t, b, ".op-img")); },
  unica(t) { app.querySelectorAll(".op").forEach(b => b.onclick = () => escolher(t, b, ".op")); },
  multipla(t) {
    const ok = app.querySelector("[data-ok]");
    app.querySelectorAll(".op").forEach(b => b.onclick = () => {
      const v = b.dataset.v; let arr = R[t.campo] || [];
      if (v === "nenhuma") arr = arr.includes(v) ? [] : [v];
      else { arr = arr.filter(x => x !== "nenhuma"); arr = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v); }
      R[t.campo] = arr;
      app.querySelectorAll(".op").forEach(x => x.classList.toggle("sel", arr.includes(x.dataset.v)));
      ok.disabled = !arr.length; vibrar();
    });
    ok.onclick = () => ir(t.prox);
  },
  campo(t) {
    const inp = document.getElementById("campo"), btn = app.querySelector("button[type=submit]");
    const valido = () => t.tel ? inp.value.replace(/\D/g, "").length >= 10 : inp.value.trim().length >= 2;
    inp.oninput = () => {
      if (t.tel) {
        const d = inp.value.replace(/\D/g, "").slice(0, 11);
        inp.value = d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d;
      }
      btn.disabled = !valido();
    };
    inp.oninput();
    setTimeout(() => inp.focus(), 300);
    app.querySelector("form").onsubmit = e => {
      e.preventDefault(); if (!valido()) return;
      let val = inp.value.trim();
      if (!t.tel) { val = val.split(" ")[0]; val = val.charAt(0).toUpperCase() + val.slice(1).toLowerCase(); }
      R[t.campo] = val;
      if (t.tel) { enviar("lead"); track("Lead"); }
      ir(t.prox);
    };
  },
  acolhe() { app.querySelector("[data-ok]").onclick = () => ir("terco"); },
  upload(t, id) {
    const arq = document.getElementById("arq");
    arq.onchange = async () => {
      const f = arq.files && arq.files[0]; if (!f) return;
      try { R.fotoArquivo = await reduzir(f, 1000); R.fotoDepois = false; vibrar(); ir(id, true); aviso("Foto escolhida ✓"); }
      catch (e) { aviso("Não deu pra abrir essa foto. Tenta outra."); }
    };
    const ok = app.querySelector("[data-ok]"); if (ok) ok.onclick = () => ir(t.prox);
  },
  virada(t) {
    app.querySelector("[data-ok]").onclick = () => ir(t.prox);
    const trilho = app.querySelector(".trilho"), pts = app.querySelectorAll(".pontos i");
    let i = 0;
    trilho.addEventListener("scroll", () => { i = Math.round(trilho.scrollLeft / trilho.clientWidth); pts.forEach((p, k) => p.classList.toggle("on", k === i)); }, { passive: true });
    timers.push(setInterval(() => { i = (i + 1) % pts.length; trilho.scrollTo({ left: i * (trilho.clientWidth + 10), behavior: "smooth" }); }, 3000));
  },
  carregando(t) {
    const pct = document.getElementById("pct"), bg = document.getElementById("bg"), itens = app.querySelectorAll(".etapas li");
    const dur = 6500;
    const PERGS = [
      { em: .30, chave: "capa", titulo: "A capa leva a foto da família toda ou de uma pessoa só?", ops: [["👨‍👩‍👧‍👦", "A família toda", "familia"], ["🙂", "De uma pessoa só", "uma"]] },
      { em: .70, chave: "tem", titulo: "Você já tem calendário de Nossa Senhora em casa?", ops: [["🗓️", "Tenho, mas é igual ao de todo mundo", "igual"], ["🏠", "Não tenho nenhum", "nao"]] }
    ];
    let vt = 0, ult = performance.now(), feitas = 0, pausado = false;
    const pergunta = q => {
      pausado = true;
      const box = document.createElement("div"); box.className = "perg-carrega";
      box.innerHTML = `<h2 class="titulo" style="font-size:22px">${q.titulo}</h2>` + q.ops.map(o => `<button class="op" type="button" data-v="${o[2]}"><span class="emo">${o[0]}</span>${o[1]}</button>`).join("");
      app.querySelector(".carregando").appendChild(box);
      box.querySelectorAll(".op").forEach(b => b.onclick = () => {
        R["q_" + q.chave] = b.dataset.v; vibrar();
        box.remove(); feitas++; pausado = false; ult = performance.now(); raf = requestAnimationFrame(tick);
      });
    };
    const tick = now => {
      vt += now - ult; ult = now;
      const p = Math.min(1, vt / dur);
      const e = p < .7 ? p / .7 * .82 : .82 + (p - .7) / .3 * .18;
      const q = PERGS[feitas];
      if (q && e >= q.em) { pct.textContent = Math.round(q.em * 100) + "%"; bg.style.width = q.em * 100 + "%"; return pergunta(q); }
      pct.textContent = Math.round(e * 100) + "%"; bg.style.width = e * 100 + "%";
      itens.forEach((li, k) => li.classList.toggle("on", e >= (k + 1) / (itens.length + .2)));
      if (p < 1) raf = requestAnimationFrame(tick); else timers.push(setTimeout(() => ir(t.prox), 500));
    };
    let raf = requestAnimationFrame(tick);
  },
  final() {
    enviar("final"); track("ViewContent", { content_name: "Calendario 2027" });
    const pagar = document.getElementById("pagar"), wa = document.getElementById("wa"), outro = document.getElementById("outro");
    const valorAtual = () => R.valor === "outro" ? (parseInt(outro.value.replace(/\D/g, ""), 10) || 0) : R.valor;
    const pintar = () => {
      const v = valorAtual();
      pagar.textContent = v ? `Quero contribuir com ${brl(v)}` : "Quero contribuir";
      if (wa) wa.href = linkWhats(v);
    };
    app.querySelectorAll(".valor").forEach(b => b.onclick = () => {
      R.valor = b.dataset.val === "outro" ? "outro" : +b.dataset.val; vibrar();
      app.querySelectorAll(".valor").forEach(x => x.classList.toggle("sel", x === b));
      outro.hidden = R.valor !== "outro"; if (R.valor === "outro") outro.focus();
      pintar();
    });
    outro.oninput = () => { outro.value = outro.value.replace(/\D/g, "").slice(0, 3); pintar(); };
    pagar.onclick = () => {
      const v = valorAtual();
      if (R.valor === "outro" && (v < CONFIG.valorMin || v > CONFIG.valorMax)) { outro.focus(); return aviso(`Escolha um valor de ${brl(CONFIG.valorMin)} a ${brl(CONFIG.valorMax)}`); }
      track("InitiateCheckout", { value: v, currency: "BRL" }); enviar("checkout");
      const item = CONFIG.valores.find(x => x.valor === v);
      if (item && item.link) { location.href = comUtm(item.link); return; }   // se alguém colocar um link manual, ele ganha
      abrirPix(v);
    };
    pintar();
  },
};

function abrirPix(valor) {
  const f = document.createElement("div"); f.className = "pixfundo";
  const fechar = () => f.remove();
  f.addEventListener("click", e => { if (e.target === f) fechar(); });
  document.body.appendChild(f);
  const form = () => {
    f.innerHTML = `<div class="pixbox"><button class="fechar" type="button" aria-label="Fechar">×</button>
      <h2>Falta só o seu e-mail</h2><p>Contribuição de <b>${brl(valor)}</b> por Pix. O Pix é gerado na hora.</p>
      <input class="campo" id="pxemail" type="email" inputmode="email" autocomplete="email" placeholder="Seu e-mail" value="${esc(R.email || "")}">
      <button class="btn verde" type="button" id="pxgerar">Gerar Pix de ${brl(valor)}</button></div>`;
    f.querySelector(".fechar").onclick = fechar;
    const em = f.querySelector("#pxemail"), bt = f.querySelector("#pxgerar");
    bt.onclick = async () => {
      const email = em.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { em.focus(); return aviso("Escreva um e-mail válido"); }
      R.email = email; bt.disabled = true; bt.textContent = "Gerando o Pix...";
      try {
        const r = await fetch(CONFIG.apiPix, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ valor, nome: R.nome, email, telefone: R.whatsapp }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.pix) throw new Error(d.erro || "Erro");
        R.pedido = d.identifier; R.produto = d.produto; enviar("pix_gerado");
        track("AddPaymentInfo", { value: valor, currency: "BRL" });
        mostrar(d);
      } catch (e) { bt.disabled = false; bt.textContent = `Gerar Pix de ${brl(valor)}`; aviso(e.message && e.message !== "Erro" ? e.message : "Não deu pra gerar o Pix. Tente de novo."); }
    };
  };
  const mostrar = d => {
    f.innerHTML = `<div class="pixbox"><button class="fechar" type="button" aria-label="Fechar">×</button>
      <h2>Pague com Pix: ${brl(valor)}</h2>
      <p>Abra o app do seu banco, escolha <b>Pix</b> e <b>Pix copia e cola</b>, ou leia o QR Code.</p>
      ${d.pix.image ? `<img class="pixqr" src="${esc(d.pix.image)}" alt="QR Code do Pix">` : ""}
      <div class="pixcod" id="pxcod">${esc(d.pix.code)}</div>
      <button class="btn verde" type="button" id="pxcopiar">Copiar código Pix</button>
      <p style="margin-top:14px">Depois de pagar, a gente te chama no WhatsApp pra confirmar as datas do seu calendário.</p></div>`;
    f.querySelector(".fechar").onclick = fechar;
    const cp = f.querySelector("#pxcopiar");
    cp.onclick = async () => {
      try { await navigator.clipboard.writeText(d.pix.code); } catch (e) { const r = document.createRange(); r.selectNodeContents(f.querySelector("#pxcod")); const se = getSelection(); se.removeAllRanges(); se.addRange(r); document.execCommand("copy"); }
      cp.textContent = "Código copiado ✓"; aviso("Código copiado. Cole no app do seu banco.");
    };
  };
  form();
}

function escolher(t, b, sel) {
  app.querySelectorAll(sel).forEach(x => x.classList.remove("sel"));
  b.classList.add("sel"); vibrar();
  R[t.campo] = b.dataset.v;
  const op = t.opcoes.find(o => o[0] === b.dataset.v);
  const destino = (op && op[3]) || t.prox;
  limparTimers();
  timers.push(setTimeout(() => ir(destino), 350));
}
function reduzir(file, max) {
  return new Promise((ok, erro) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); erro(); };
    img.src = url;
  });
}
function vibrar() { try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} }
function comUtm(url) {
  try { const u = new URL(url); params.forEach((v, k) => { if (/^(utm_|fbclid|src|sck|xcod)/i.test(k)) u.searchParams.set(k, v); }); return u.toString(); } catch (e) { return url; }
}
function linkWhats(valor) {
  const msg = `Olá! Quero o meu Calendário 2027 de Nossa Senhora.\n\nNome: ${R.nome || ""}\nDevoção: ${DEVOCOES[R.devocao] || ""}\nOração: ${ORACOES[R.oracao] || ""}\nContribuição: ${brl(valor || 0)}\n\n${R.fotoArquivo && CONFIG.webhook ? "Já mandei a foto pelo site." : "Vou mandar a foto por aqui."}`;
  return `https://wa.me/${CONFIG.whatsapp.replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`;
}

/* marca, pixel e início */
document.getElementById("marca").innerHTML = CONFIG.logo ? `<img src="${CONFIG.logo}" alt="${esc(CONFIG.marca)}">` : esc(CONFIG.marca);
if (CONFIG.pixelId) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq("init", CONFIG.pixelId); fbq("track", "PageView");
}
const devUrl = params.get("devocao");
if (devUrl && DEVOCOES[devUrl]) {         // ?devocao=fatima pula a 1ª pergunta
  R.devocao = devUrl;
  TELAS.nome.imagem = [IMG.abertura, "16/10"];
  TELAS.nome.titulo = `Monte o seu Calendário 2027 de ${DEVOCOES[devUrl]} com a foto da sua família`;
  TELAS.nome.texto = "Responda umas perguntinhas rápidas. Leva 1 minuto. Pra começar, como você se chama?";
  ir("nome");
} else ir("devocao");
</script>
