<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendário 2027 de Nossa Senhora</title>
<meta name="description" content="Monte o seu Calendário 2027 de Nossa Senhora com a foto da sua família.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cor:#1F3B73;        /* cor principal */
  --cor-clara:#EEF2FA;
  --verde:#16A34A;      /* botão de contribuir */
  --verde-esc:#12813B;
  --texto:#1A1A1A;
  --cinza:#5F5F5F;
  --borda:#E4E4E4;
  --fundo:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:400 18px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
[hidden]{display:none!important}

.wrap{max-width:460px;margin:0 auto;padding:0 18px 40px}

/* topo */
.top{position:sticky;top:0;z-index:10;background:#fff;padding:12px 18px 10px;max-width:460px;margin:0 auto}
.top-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:40px}
.voltar{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--texto)}
.voltar svg{width:24px;height:24px}
.marca{font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--cor);text-align:center}
.marca img{max-height:38px;margin:0 auto}
.barra{height:6px;background:#EDEDED;border-radius:99px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;width:0;background:var(--cor);border-radius:99px;transition:width .5s ease}

/* tela */
.tela{padding-top:14px;animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(12px)}}
.titulo{margin:6px 0 0;font-size:25px;line-height:1.22;font-weight:800;text-align:center;letter-spacing:-.01em}
.texto{margin:10px 0 0;color:var(--cinza);text-align:center;font-size:17.5px}
.pergunta{margin:22px 0 0;font-size:21px;font-weight:700;text-align:center;line-height:1.25}
.foto{margin:16px 0 0;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(100deg,#EFEFEF 30%,#F8F8F8 50%,#EFEFEF 70%) 0 0/200% 100%;animation:brilho 1.3s linear infinite}
@keyframes brilho{to{background-position:-200% 0}}
.foto img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .25s}
.foto img.ok{opacity:1}
.foto.pronta{animation:none;background:#F2F2F2}
.foto .ph-lbl{display:none}
.foto.falhou .ph-lbl{display:flex}
.foto .ph-lbl-old{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#9A9A9A;font-size:13px;font-weight:600;text-align:center;padding:10px}
.foto .ph-lbl b{font-size:26px}

/* opções */
.opcoes{display:grid;gap:12px;margin-top:20px}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 16px;background:#fff;border:2px solid var(--borda);border-radius:12px;text-align:left;font-weight:600;font-size:18px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:border-color .15s,background .15s,transform .1s}
.op:active{transform:scale(.98)}
.op:hover{border-color:#C9C9C9}
.op.sel{border-color:var(--cor);background:var(--cor-clara)}
.op .emo{font-size:24px;line-height:1;flex:none;width:30px;text-align:center}
.op .ck{margin-left:auto;flex:none;width:24px;height:24px;border-radius:6px;border:2px solid #CFCFCF;display:grid;place-items:center}
.op.sel .ck{background:var(--cor);border-color:var(--cor)}
.op.sel .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.op-img{display:flex;flex-direction:column;padding:0;overflow:hidden;background:#fff;border:2px solid var(--borda);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.04);text-align:center;transition:border-color .15s,transform .1s}
.op-img:active{transform:scale(.97)}
.op-img.sel{border-color:var(--cor)}
.op-img .foto{margin:0;border-radius:0;aspect-ratio:1/1}
.op-img span.nm{display:block;padding:10px 8px 12px;font-weight:700;font-size:15.5px;line-height:1.25}
.op-img.sel span.nm{background:var(--cor);color:#fff}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;margin-top:22px;padding:14px 20px;border:0;border-radius:12px;background:var(--cor);color:#fff;font-weight:700;font-size:19px;box-shadow:0 6px 16px -6px rgba(31,59,115,.55);transition:opacity .15s,transform .1s;text-decoration:none;text-align:center}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.verde{background:var(--verde);box-shadow:0 8px 18px -6px rgba(22,163,74,.6)}
.btn.verde:hover{background:var(--verde-esc)}
.btn.contorno{background:#fff;color:#128C4A;border:2px solid #25A35A;box-shadow:none}
.pulsa{animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

/* campos */
.campo{display:block;width:100%;margin-top:22px;min-height:62px;padding:14px 18px;border:2px solid var(--borda);border-radius:12px;font-size:19px;background:#fff;outline:none;transition:border-color .15s}
.campo:focus{border-color:var(--cor)}
.campo::placeholder{color:#A8A8A8}

/* destaque / acolhimento */
.destaque{margin:20px 0 0;padding:18px;border-radius:12px;background:#FBF6E9;border-left:4px solid #C99A3B;font-size:18px;font-weight:600;line-height:1.4}
.destaque small{display:block;margin-top:8px;font-weight:500;color:#8A6D2E;font-size:14.5px}

/* lista */
.lista{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.lista li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:#F7F7F7;font-weight:600;font-size:17px;line-height:1.35}
.lista li .emo{font-size:22px;line-height:1.1}

/* carrossel */
.carrossel{margin-top:18px}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:14px}
.trilho::-webkit-scrollbar{display:none}
.trilho .foto{flex:none;width:100%;min-width:100%;margin:0;scroll-snap-align:center;aspect-ratio:4/5}
.pontos{display:flex;justify-content:center;gap:7px;margin-top:10px}
.pontos i{width:8px;height:8px;border-radius:50%;background:#D5D5D5;transition:all .2s}
.pontos i.on{background:var(--cor);width:22px;border-radius:99px}

/* carregando */
.carregando{text-align:center;padding-top:30px}
.pct{font-size:56px;font-weight:800;color:var(--cor);letter-spacing:-.02em;margin-top:18px}
.barra-g{height:14px;background:#EDEDED;border-radius:99px;overflow:hidden;margin:14px 0 0}
.barra-g i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cor),#3D63B0);border-radius:99px}
.popup-fundo{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);animation:aparece .2s ease-out}
.popup{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:24px 18px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:sobe .25s ease-out}
.popup .titulo{font-size:22px;margin:0 0 16px;text-align:center}
.popup .op{margin-bottom:10px}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes sobe{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.etapas{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:12px;text-align:left}
.etapas li{display:flex;gap:12px;align-items:center;font-size:17px;color:#B0B0B0;transition:color .3s}
.etapas li.on{color:var(--texto);font-weight:600}
.etapas li .bol{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #D5D5D5;display:grid;place-items:center}
.etapas li.on .bol{background:var(--verde);border-color:var(--verde)}
.etapas li.on .bol::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}


/* exemplos passando */
.passa{margin:22px -16px 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.passa-lbl{margin:26px 0 0;text-align:center;font-weight:800;font-size:19px;line-height:1.3}
.passa-trilho{display:flex;gap:12px;width:max-content;animation:passa 38s linear infinite}
.passa-trilho img{flex:none;width:170px;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:#EEE}
@keyframes passa{to{transform:translateX(calc(-50% - 6px))}}
@media (prefers-reduced-motion:reduce){.passa-trilho{animation-duration:120s}}

/* checkout */
.ck-inline[hidden]{display:none}
.ck-inline{margin-top:6px}
.ck-banner{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:14px;background:#F6F0E4}
.ck-card h2 em{font-style:normal}
.ck-n{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:9px;border-radius:50%;background:var(--cor);color:#fff;font-style:normal;font-size:14px;font-weight:700;vertical-align:2px}
.ck-nota svg{vertical-align:-3px;margin-right:3px}
.ck-pix{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid #32BCAD;border-radius:12px;background:#F0FBF9}
.ck-pix b{display:block;font-size:18px}
.ck-pix small{display:block;color:#555;font-size:14px;line-height:1.3}
.ck-pixlogo{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid #CFEDE8}
.ck-marca{margin-left:auto;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#32BCAD;color:#fff;font-weight:800;font-size:14px}
.ck-sel svg{vertical-align:-3px}
body.pagando #app>.tela>*:not(#checkout){display:none!important}
body.pagando #voltar{display:none!important}
.bump{display:block;margin-top:14px;padding:12px;border:2px dashed #2F6FD6;border-radius:10px;background:#EEF4FF;cursor:pointer}
.bump.sel{background:#E3EEFF;border-style:solid}
.bump .bt{display:block;text-align:center;font-weight:800;font-size:14.5px;color:#1F4FA8;letter-spacing:.01em}
.bump .bl{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:16px;line-height:1.35}
.bump input{flex:none;width:24px;height:24px;margin-top:2px;accent-color:var(--cor)}
.bump .bp{display:block;margin-top:4px;font-weight:800;color:#12813B}
.ck-linha{display:flex;justify-content:space-between;margin-top:8px;font-size:16px;color:#444}
.ck-meios{display:flex;gap:8px;margin-top:14px}
.ck-meios span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:2px solid #12813B;border-radius:10px;font-weight:700;color:#12813B;background:#F0FAF4}

.ck-passos{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 16px;font-size:14px;font-weight:600;color:#9A9A9A}
.ck-passos b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#DADADA;color:#fff;font-size:13px;margin-right:5px}
.ck-passos .on{color:var(--cor)} .ck-passos .on b{background:var(--cor)}
.ck-passos .feito{color:#12813B} .ck-passos .feito b{background:#12813B}
.ck-passos i{flex:none;width:18px;height:2px;background:#DADADA}
.ck-card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:16px;margin-top:12px}
.ck-card h2{margin:0 0 10px;font-size:19px;font-weight:800;line-height:1.25}
.ck-res{display:flex;gap:12px;align-items:center}
.ck-res img{flex:none;width:64px;height:80px;border-radius:8px;object-fit:cover;background:#EEE}
.ck-res .t{font-weight:700;font-size:17px;line-height:1.3}
.ck-res .s{color:#666;font-size:15px;margin-top:2px}
.ck-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px dashed var(--borda);font-size:17px;font-weight:700}
.ck-total span:last-child{font-size:26px;font-weight:800;color:var(--cor)}
.ck-lbl{display:block;margin:12px 0 4px;font-size:15px;font-weight:600;color:#444}
.ck-card .campo{margin-top:0}
.ck-nota{margin:8px 0 0;color:#666;font-size:14px}
.ck-sel{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:14px;color:#555;font-size:14px;font-weight:600}
.ck-voltar{display:block;width:100%;margin-top:10px;padding:12px;border:0;background:none;color:#666;font-size:16px;font-weight:600;text-decoration:underline}
.ck-valor{text-align:center;font-size:40px;font-weight:800;color:var(--cor);margin:2px 0 0}
.ck-tempo{text-align:center;margin:4px 0 0;color:#444;font-size:16px}
.ck-tempo b{font-variant-numeric:tabular-nums;color:#B42318}
.ck-qr{display:block;margin:14px auto 0;width:220px;height:220px;border:1px solid var(--borda);border-radius:12px;padding:8px;background:#fff}
.ck-cod{margin-top:14px;padding:12px;background:#F4F4F4;border-radius:10px;font-size:13px;word-break:break-all;color:#333;max-height:76px;overflow:hidden;position:relative}
.ck-aguarda{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;color:#444;font-weight:600;font-size:16px}
.ck-spin{width:18px;height:18px;border:3px solid #D5D5D5;border-top-color:var(--cor);border-radius:50%;animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.ck-como{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.ck-como li{display:flex;gap:12px;font-size:16.5px;line-height:1.35}
.ck-como b{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--cor-clara);color:var(--cor);font-size:14px}
.ck-ok{text-align:center;padding:30px 10px}
.ck-ok .big{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--verde);color:#fff;font-size:46px}
.ck-ok h2{font-size:26px;margin:0 0 8px}
.ck-ok p{font-size:18px;color:#333;margin:0 0 8px}

/* final */
.selo{display:inline-block;margin:0 auto;padding:6px 14px;border-radius:99px;background:#E8F6EE;color:#12813B;font-weight:700;font-size:14px}
.centro{text-align:center}
.resumo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.resumo span{padding:7px 12px;border-radius:99px;background:var(--cor-clara);color:var(--cor);font-weight:600;font-size:14.5px}
.caixa{margin-top:26px;padding:20px 18px;border-radius:14px;border:1px solid var(--borda);background:#fff}
.caixa h3{margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.25}
.caixa p{margin:0;color:#444;font-size:17px}
.passos{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:14px}
.passos li{display:flex;gap:14px;align-items:flex-start;font-size:17px;font-weight:500}
.passos b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cor);color:#fff;display:grid;place-items:center;font-size:16px}
.h2{margin:34px 0 0;font-size:23px;font-weight:800;text-align:center;line-height:1.25}
.valores{display:grid;gap:12px;margin-top:18px}
.valor{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:2px solid var(--borda);border-radius:14px;background:#fff;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:border-color .15s,background .15s}
.valor.sel{border-color:var(--verde);background:#F1FAF4}
.valor .rd{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #C9C9C9;display:grid;place-items:center}
.valor.sel .rd{border-color:var(--verde)}
.valor.sel .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--verde)}
.valor .vl{font-size:26px;font-weight:800;white-space:nowrap}
.valor .ds{font-size:15.5px;color:#555;font-weight:500;line-height:1.3}
.valor .tag{position:absolute;top:-11px;right:14px;padding:3px 10px;border-radius:99px;background:var(--verde);color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.seguro{margin:12px 0 0;text-align:center;color:#6B6B6B;font-size:15px}
.faq{margin-top:12px}
.faq details{border-bottom:1px solid var(--borda)}
.faq summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:16px 0;font-weight:700;font-size:17px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;color:var(--cor);font-weight:600}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0 0 16px;color:#444;font-size:16.5px}
.rodape{margin-top:36px;text-align:center;color:#9A9A9A;font-size:13px}
.upload{display:block;width:100%;max-width:320px;margin:20px auto 0;aspect-ratio:1/1;border:2px dashed #C4C4C4;border-radius:16px;overflow:hidden;cursor:pointer;background:#FAFAFA}
.upload img{width:100%;height:100%;object-fit:cover}
.up-in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--cor);font-weight:700;font-size:17px;text-align:center;padding:16px}
.up-in b{font-size:46px;line-height:1}
.btn.contorno2{background:#fff;color:var(--cor);border:2px solid var(--cor);box-shadow:none;margin-top:12px}
.link{display:block;margin:14px auto 0;padding:12px;border:0;background:none;color:var(--cor);font-weight:700;font-size:17px;text-decoration:underline;text-underline-offset:4px}
.sua-foto{display:flex;align-items:center;gap:14px;margin-top:18px;padding:12px;border-radius:14px;background:#F1FAF4;border:1px solid #CDEBD8;font-weight:600;font-size:16px}
.sua-foto img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.aviso{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);opacity:0;max-width:calc(100% - 32px);padding:13px 18px;border-radius:10px;background:#1A1A1A;color:#fff;font-weight:600;font-size:15px;transition:all .3s;z-index:50;text-align:center}
.aviso.on{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <button class="voltar" id="voltar" type="button" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="marca" id="marca"></div>
  </div>
  <div class="barra"><i id="barra"></i></div>
</header>

<main class="wrap" id="app"></main>
<div class="aviso" id="aviso" role="status"></div>

<script>
/* =====================================================
   CONFIGURAÇÃO: preencha aqui
   ===================================================== */
const CONFIG = {
  marca: "Calendário 2027 · Nossa Senhora",
  logo: "",                         // ex: "img/logo.webp" (vazio = mostra o texto acima)
  campanha: "Calendário Nossa Senhora",
  ondeVai: "A sua contribuição cobre o custo de manter o projeto funcionando e ajuda a gente a chegar em mais devotos de Nossa Senhora, levando o calendário e a fé pra mais lares e mais famílias.",
  prazo: "Em até 5 minutos depois do pagamento, por e-mail ou WhatsApp.",
  whatsapp: "",                     // só números com DDI e DDD. ex: "5511999999999"
  webhook: "",                      // opcional: URL que recebe as respostas (Make, n8n, planilha...)
  pixelId: "",                      // opcional: Meta Pixel
  valores: [
    { valor: 15,  texto: "Meu calendário personalizado", link: "" },
    { valor: 20,  texto: "Meu calendário + uma ajuda a mais", link: "" },

function limparTimers() { timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; }
function aviso(m) { const a = document.getElementById("aviso"); a.textContent = m; a.classList.add("on"); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove("on"), 2500); }
function track(ev, data, custom) { try { window.fbq && fbq(custom ? "trackCustom" : "track", ev, data || {}); } catch (e) {} }
function enviar(etapa) {
  if (!CONFIG.webhook) return;
  try { fetch(CONFIG.webhook, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ etapa, ...R, utm: Object.fromEntries(params) }) }); } catch (e) {}
}

function ir(id, voltando) {
  limparTimers();
  const t = TELAS[id];
  if (!voltando && historico[historico.length - 1] !== id) historico.push(id);
  document.getElementById("barra").style.width = Math.round((t.passo / TOTAL) * 100) + "%";
  document.getElementById("voltar").hidden = historico.length < 2 || t.tipo === "carregando" || t.tipo === "final";
  app.innerHTML = `<section class="tela">${render[t.tipo](t, id)}</section>`;
  window.scrollTo(0, 0);
  montar[t.tipo] && montar[t.tipo](t, id);
  track("QuizEtapa", { etapa: t.passo, tela: id }, true);
}
function voltar() { if (historico.length < 2) return; historico.pop(); ir(historico[historico.length - 1], true); }
document.getElementById("voltar").addEventListener("click", voltar);

  fbq("init", CONFIG.pixelId); fbq("track", "PageView");
}
// pré-carrega todas as imagens (as da 1ª tela primeiro) pra não aparecer em branco
[IMG.abertura, IMG.fatima, IMG.aparecida, IMG.gracas, IMG.nos, IMG.socorro, IMG.todas, IMG.acolhimento, ...IMG.carrossel, IMG.final, "img/checkout.webp"].forEach((u, i) => setTimeout(() => { const im = new Image(); im.decoding = "async"; im.src = u; }, i < 7 ? 0 : 400));
// se a pessoa recarregou a página com um Pix ainda valendo, volta direto pra tela do Pix
let voltouPix = false;
try {
  const p = JSON.parse(localStorage.getItem("pixPendente") || "null");
  if (p && p.d && p.d.pix && (!p.d.pix.expiresAt || new Date(p.d.pix.expiresAt) > new Date())) {
    Object.assign(R, { nome: p.nome, whatsapp: p.whatsapp, devocao: p.devocao, valor: p.d.valor });
    checkoutRetomar = p; voltouPix = true;
  } else localStorage.removeItem("pixPendente");
} catch (e) {}
const devUrl = params.get("devocao");
if (voltouPix) ir("final");
else if (devUrl && DEVOCOES[devUrl]) {         // ?devocao=fatima pula a 1ª pergunta
  R.devocao = devUrl;
  TELAS.nome.imagem = [IMG.abertura, "16/10"];
  TELAS.nome.titulo = `Monte o seu Calendário 2027 de ${DEVOCOES[devUrl]} com a foto da sua família`;
  TELAS.nome.texto = "Responda umas perguntinhas rápidas. Leva 1 minuto. Pra começar, como você se chama?";
  ir("nome");
} else ir("devocao");
